services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    ports:
      - "8082:80"

    environment:
      DOMAIN: "https://vault.vortex42.local"
      SIGNUPS_ALLOWED: "flase"

    volumes:
      - vaultwarden_data:/data

volumes:
  vaultwarden_data:
