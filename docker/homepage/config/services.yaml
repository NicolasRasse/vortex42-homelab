- Mantenimiento:

  - Actualizaciones APT:
      icon: mdi-package-up
      description: Estado de actualizaciones del sistema
      widget:
        type: customapi
        url: http://192.168.1.117:8091/status
        refreshInterval: 30000
        display: list
        mappings:
          - field: updates.server
            label: vortex42-server
            remap:
              - value: 0
                to: AL DÍA

          - field: updates.pi5
            label: pi5-nube
            remap:
              - value: 0
                to: AL DÍA

          - field: updates.pi3
            label: pi3-red
            remap:
              - value: 0
                to: AL DÍA

          - field: updated_at
            label: Último chequeo
            format: relativeDate

  - Backups:
      icon: mdi-backup-restore
      description: Estado de las copias de seguridad
      widget:
        type: customapi
        url: http://192.168.1.117:8091/status
        refreshInterval: 30000
        display: list
        mappings:
          - field: backups.server.status
            label: Server
            remap:
              - value: ok
                to: OK
              - value: stale
                to: ATRASADO
              - value: missing
                to: SIN BACKUP
            additionalField:
              field: backups.server.last
              format: relativeDate

          - field: backups.immich.status
            label: Immich
            remap:
              - value: ok
                to: OK
              - value: stale
                to: ATRASADO
              - value: missing
                to: SIN BACKUP
            additionalField:
              field: backups.immich.last
              format: relativeDate

          - field: backups.pihole.status
            label: Pi-hole
            remap:
              - value: ok
                to: OK
              - value: stale
                to: ATRASADO
              - value: missing
                to: SIN BACKUP
            additionalField:
              field: backups.pihole.last
              format: relativeDate

          - field: backups.vaultwarden.status
            label: Vaultwarden
            remap:
              - value: ok
                to: OK
              - value: stale
                to: ATRASADO
              - value: missing
                to: SIN BACKUP
            additionalField:
              field: backups.vaultwarden.last
              format: relativeDate


