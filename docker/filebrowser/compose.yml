services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped

    ports:
      - "8081:80"

    volumes:
      - /home/vortex42:/srv
      - filebrowser_db:/database
      - filebrowser_config:/config

volumes:
  filebrowser_db:
  filebrowser_config:
